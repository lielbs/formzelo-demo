    <style>
      .fz-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #f7f7f8; }
      .fz-splash svg { border-radius: 15px; box-shadow: 0 14px 34px -14px rgb(24 33 45 / 0.55); animation: fz-splash-in 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) both; }
      .fz-splash-bar { position: relative; width: 72px; height: 3px; overflow: hidden; border-radius: 3px; background: rgb(24 33 45 / 0.1); }
      .fz-splash-bar span { position: absolute; inset-block: 0; width: 40%; border-radius: 3px; background: #e96b3d; animation: fz-splash-run 1s ease-in-out infinite; }
      @keyframes fz-splash-in { from { opacity: 0; transform: scale(0.86); } }
      @keyframes fz-splash-run { from { inset-inline-start: -40%; } to { inset-inline-start: 100%; } }
      @media (prefers-color-scheme: dark) { .fz-splash { background: #0f141b; } .fz-splash-bar { background: rgb(255 255 255 / 0.12); } }
      @media (prefers-reduced-motion: reduce) { .fz-splash svg, .fz-splash-bar span { animation: none; } .fz-splash-bar span { inset-inline-start: 30%; } }
    </style>
  </head>
