name: Deploy site (demo + production app) to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Custom domain serves Formangle at the origin root, not the legacy /<repo>/ path.
      - run: npm run build
        env:
          VITE_BASE: /
          # Optional override of the interest-button address (repository variable; empty = default in src/lib/links.ts).
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          # Optional public address (e.g. a custom domain) for og:image / og:url; empty = the Pages URL.
          VITE_SITE_URL: https://formangle.rockstackds.com
      # Production app at /live/: the dedicated Formangle project only, publishable key only
      # (public by design; the runtime refuses any other project or a secret key).
      - name: Build the production app at /live/
        run: npx vite build --outDir dist/live --emptyOutDir
        env:
          VITE_BASE: /live/
          VITE_SITE_URL: https://formangle.rockstackds.com
          VITE_FORMANGLE_MODE: production
          VITE_SUPABASE_PROJECT_REF: ppgdbqhwbzlgzwsjmkor
          VITE_SUPABASE_URL: https://ppgdbqhwbzlgzwsjmkor.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_f4SQeCD1MuE78Fgf-ZVr7Q_bxJhowCy
      # SPA fallback: the site-wide 404.html is the production app, so customer deep links
      # (/live/t/<venue>, /live/f/<form>) open in one load; public/site-fallback.js sends any other
      # unknown path back to the demo at the root.
      - run: sed 's#<head>#<head><script src="/site-fallback.js"></script>#' dist/live/index.html > dist/404.html
      - name: Verify both apps are in the artifact
        run: |
          test -f dist/live/index.html && test -f dist/live/track.html && test -f dist/live/invite.html && test -f dist/live/reset.html
          grep -q 'site-fallback.js' dist/404.html && grep -q '/live/assets/' dist/404.html && test -f dist/site-fallback.js
          # A real secret key or a service_role JWT (base64 of the role) must never ship.
          ! grep -rqE 'sb_secret_[A-Za-z0-9_-]{16,}|c2VydmljZV9yb2xl' dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
