name: Validate production foundation

on:
  pull_request:
    branches: [main, production-v1]
  push:
    branches: [main, production-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Migrations, RLS, types, and application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_CLI_VERSION: "3.0.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked application dependencies
        run: npm ci

      - name: Verify synthetic local-only inputs
        run: |
          test ! -e supabase/.temp/project-ref
          test ! -e supabase/.env
          grep -q "Synthetic organizations only" supabase/seed.sql
          if git grep -nE 's[b]_secret_[A-Za-z0-9_-]{20,}|SUPABASE_(ACCESS_TOKEN|SECRET_KEY)=[^[:space:]]+|BEGIN (RSA|OPENSSH|EC) PRIVATE KE[Y]'; then
            echo "Refusing to run with a committed credential or private key."
            exit 1
          fi

      - name: Start isolated local Supabase
        run: |
          start_log="$RUNNER_TEMP/supabase-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start >"$start_log" 2>&1; then
            grep -Ev 'SECRET_KEY|JWT_SECRET|ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY' "$start_log" | tail -100
            exit 1
          fi

      - name: Run pgTAP and RLS tests
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" test db

      - name: Lint database schemas
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" db lint --schema public,private --level warning --fail-on error

      - name: Verify generated database types
        run: |
          generated="$RUNNER_TEMP/database.generated.ts"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" gen types --schema public \
            | sed -E 's/[[:space:]]+$//' >"$generated"
          diff --unified src/production/database.generated.ts "$generated"

      - name: Typecheck application
        run: npm run typecheck

      - name: Lint application
        run: npm run lint

      - name: Test application
        run: npm test

      - name: Verify browser and server rules match (synthetic local database)
        env:
          FORMANGLE_PARITY_DB: postgres://postgres:postgres@127.0.0.1:54322/postgres
        run: npx vitest run src/production/serverParity.test.ts

      - name: Build production application
        run: npm run build

      - name: Stop isolated local Supabase
        if: always()
        continue-on-error: true
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup

  # The Tables journeys in a real browser against the same disposable local stack (UX audit
  # 2026-11, C2): booking, live shift with two hosts, a busy Friday, owner screens and access.
  # Synthetic data only; the keys are the local stack's own and are masked in the log.
  tables-e2e:
    name: Tables journeys in a browser (local stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      SUPABASE_CLI_VERSION: "3.0.0"
      E2E_BROWSER_CHANNEL: chromium

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install locked application dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start isolated local Supabase
        run: |
          start_log="$RUNNER_TEMP/supabase-start.log"
          if ! npx --yes "supabase@${SUPABASE_CLI_VERSION}" start >"$start_log" 2>&1; then
            grep -Ev 'SECRET_KEY|JWT_SECRET|ANON_KEY|SERVICE_ROLE_KEY|PUBLISHABLE_KEY' "$start_log" | tail -100
            exit 1
          fi

      - name: Hand the local stack keys to the tests (masked)
        run: |
          status="$RUNNER_TEMP/stack.env"
          npx --yes "supabase@${SUPABASE_CLI_VERSION}" status -o env >"$status"
          value() { grep -E "^$1=" "$status" | head -1 | cut -d= -f2- | tr -d '"'; }
          pub="$(value PUBLISHABLE_KEY)"; [ -n "$pub" ] || pub="$(value ANON_KEY)"
          svc="$(value SECRET_KEY)"; [ -n "$svc" ] || svc="$(value SERVICE_ROLE_KEY)"
          rm -f "$status"
          if [ -z "$pub" ] || [ -z "$svc" ]; then echo "Local stack keys not found"; exit 1; fi
          echo "::add-mask::$pub"
          echo "::add-mask::$svc"
          { echo "E2E_SUPABASE_PUBLISHABLE_KEY=$pub"; echo "E2E_SUPABASE_SERVICE_KEY=$svc"; } >>"$GITHUB_ENV"

      - name: Run the Tables journeys
        run: >-
          npx playwright test
          e2e/tables/journeys.spec.ts
          e2e/tables/host-shift.spec.ts
          e2e/tables/busy-shift.spec.ts
          e2e/tables/owner.spec.ts
          e2e/tables/access.spec.ts

      - name: Stop isolated local Supabase
        if: always()
        continue-on-error: true
        run: npx --yes "supabase@${SUPABASE_CLI_VERSION}" stop --no-backup
